version: '3.8'

services:
  indexer:
    image: ${INDEXER_IMAGE:-btcstamps/indexer:latest}
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        max_attempts: 5
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
      resources:
        limits:
          cpus: '2'
          memory: 4G
    command: poetry run indexer
    volumes:
      - stamps_files:/usr/src/app/files
    environment:
      - DOCKER_CONTAINER=1
      - RDS_HOSTNAME=${RDS_HOSTNAME}
      - RDS_PORT=${RDS_PORT:-3306}
      - RDS_USER=${RDS_USER}
      - RDS_DATABASE=${RDS_DATABASE}
      - RPC_IP=${RPC_IP}
      - RPC_PORT=${RPC_PORT:-8332}
      - RPC_USER=${RPC_USER}
      - BACKEND_POLL_INTERVAL=${BACKEND_POLL_INTERVAL:-0.5}
      - DOMAINNAME=${DOMAINNAME:-stampchain.io}
      - STORE_FILES=${STORE_FILES:-true}
      - USE_ASYNC_UPLOADS=${USE_ASYNC_UPLOADS:-true}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_S3_BUCKETNAME=${AWS_S3_BUCKETNAME:-stamps}
      - AWS_S3_IMAGE_DIR=${AWS_S3_IMAGE_DIR:-images}
      - AWS_CLOUDFRONT_DISTRIBUTION_ID=${AWS_CLOUDFRONT_DISTRIBUTION_ID}
      - DEBUG=${DEBUG:-false}
      - DEBUG_VALIDATION=${DEBUG_VALIDATION:-false}
      - DEBUG_PROFILING=${DEBUG_PROFILING:-false}
    secrets:
      - rpc_password
      - aws_secret_key
      - rds_password
    networks:
      - stamps_network
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'python.*indexer' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  app:
    image: ${APP_IMAGE:-btcstamps/app:latest}
    deploy:
      replicas: ${APP_REPLICAS:-2}
      restart_policy:
        condition: on-failure
      update_config:
        parallelism: 1
        delay: 5s
        order: start-first
    volumes:
      - stamps_files:/app/static/stamps
    environment:
      - DOCKER_CONTAINER=1
      - RDS_HOSTNAME=${RDS_HOSTNAME}
      - RDS_PORT=${RDS_PORT:-3306}
      - RDS_USER=${RDS_USER}
      - RDS_DATABASE=${RDS_DATABASE}
      - APP_ENV=${APP_ENV:-production}
      - DEBUG=${DEBUG:-false}
    secrets:
      - rds_password
    networks:
      - stamps_network
    ports:
      - "${APP_PORT:-8080}:8000"

networks:
  stamps_network:
    driver: overlay
    attachable: true

volumes:
  stamps_files:
    driver: local

secrets:
  rpc_password:
    external: true
  aws_secret_key:
    external: true
  rds_password:
    external: true